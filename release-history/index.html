  <style>

    :root {
      color-scheme: light;
      --ink: #15232d;
      --muted: #4c6070;
      --primary: #0f6678;
      --primary-soft: #dceef2;
      --bg-a: #edf4f8;
      --bg-b: #fbf6ee;
      --surface: rgba(255, 255, 255, 0.9);
      --line: rgba(20, 44, 58, 0.14);
      --radius: 20px;
      --shadow: 0 20px 45px -28px rgba(18, 39, 52, 0.42);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Public Sans", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(80rem 80rem at -10% -20%, #d5eaf0 0%, transparent 55%),

        linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
      min-height: 100dvh;
      line-height: 1.65;
    }

    header, main, footer {
      width: min(980px, 92vw);
      margin: 0 auto;
    }

    header {
      padding: clamp(2.2rem, 5vw, 3.6rem) 0 1rem;
      margin-bottom: 0.4rem;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      padding: 0.42rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    nav a:hover {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: rgba(15, 102, 120, 0.3);
      text-decoration: none;
    }

    main {
      padding: 0 0 clamp(2.8rem, 5vw, 4rem);
    }

    h1 {
      font-family: "Sora", "Public Sans", sans-serif;
      line-height: 1.1;
      font-size: clamp(2rem, 5vw, 3.1rem);
      margin: 0 0 0.65rem;
    }

    .muted {
      color: var(--muted);
      opacity: 1;
    }

    .intro {
      max-width: 76ch;
      margin: 0 0 1.1rem;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      margin: 1rem 0 1.2rem;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }

    input[type="search"],
    select {
      padding: 0.72rem 0.9rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    input[type="search"] {
      min-width: 240px;
      flex: 1 1 280px;
    }

    select {
      min-width: 170px;
      flex: 0 0 auto;
    }

    input[type="search"]:focus,
    select:focus {
      border-color: rgba(15, 102, 120, 0.45);
      box-shadow: 0 0 0 3px rgba(15, 102, 120, 0.12);
    }

    .release {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem 1.05rem;
      margin: 0 0 0.9rem;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }

    .release:first-of-type {
      border-top: 1px solid var(--line);
      padding-top: 1rem;
    }

    .meta {
      display: flex;
      gap: 0.55rem;
      flex-wrap: wrap;
      align-items: baseline;
    }

    .version {
      font-weight: 800;
      letter-spacing: 0.2px;
      color: #122f3f;
      font-size: 1.02rem;
    }

    .badge {
      font-size: 0.73rem;
      padding: 0.2rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
    }

    .badge.good {
      border-style: solid;
      color: #115e49;
      background: #e7f7ef;
    }

    .badge.warn {
      border-style: solid;
      color: #7a4a11;
      background: #fff4dd;
    }

    h3 {
      margin: 0.9rem 0 0.35rem;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #355264;
      font-family: "Sora", "Public Sans", sans-serif;
      opacity: 1;
    }

    ul {
      margin: 0.25rem 0 0 1.1rem;
      padding: 0;
    }

    li {
      margin: 0.27rem 0;
    }

    footer {
      margin-top: 0.4rem;
      padding: 0 0 2rem;
      border-top: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      header {
        padding-top: 1.4rem;
      }

      .controls {
        padding: 0.8rem;
      }

      .release {
        padding: 0.88rem 0.85rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

    function norm(s) { return (s || "").toLowerCase(); }

    function matchesQuery(r, q) {
      if (!q) return true;
      const hay = [
        r.version, r.date, r.channel,
        ...(r.sections || []).flatMap(s => [s.title, ...(s.notes || [])])
      ].join(" • ");
      return norm(hay).includes(norm(q));
    }

    function matchesChannel(r, c) {
      if (c === "all") return true;
      const rc = norm(r.channel);
      if (c === "stable") return rc === "stable";
      if (c === "beta") return rc === "beta";
      if (c === "unreleased") return rc === "unreleased";
      return true;
    }

    function badgeClass(channel) {
      const c = norm(channel);
      if (c === "stable") return "badge good";
      if (c === "beta") return "badge warn";
      if (c === "unreleased") return "badge warn";
      return "badge";
    }

    function render() {
      const q = qEl.value.trim();
      const c = channelEl.value;

      const filtered = releaseData.filter(r => matchesChannel(r, c) && matchesQuery(r, q));

      releasesEl.innerHTML = "";
      if (!filtered.length) {
        releasesEl.innerHTML = `<p class="muted">Keine Treffer.</p>`;
        return;
      }

      filtered.forEach(r => {
        const article = document.createElement("article");
        article.className = "release";

        const meta = document.createElement("div");
        meta.className = "meta";

        const v = document.createElement("span");
        v.className = "version";
        v.textContent = r.version === "Unreleased" ? "Unreleased" : `v${r.version}`;
        meta.appendChild(v);

        if (r.channel) {
          const b = document.createElement("span");
          b.className = badgeClass(r.channel);
          b.textContent = r.channel;
          meta.appendChild(b);
        }

        if (r.date) {
          const d = document.createElement("span");
          d.className = "muted";
          d.textContent = r.date;
          meta.appendChild(d);
        }

        article.appendChild(meta);

        (r.sections || []).forEach(sec => {
          const h = document.createElement("h3");
          h.textContent = sec.title || "";
          article.appendChild(h);

          const ul = document.createElement("ul");
          (sec.notes || []).forEach(n => {
            const li = document.createElement("li");
            li.textContent = n;
            ul.appendChild(li);
          });
          article.appendChild(ul);
        });

        releasesEl.appendChild(article);
      });
    }

    qEl.addEventListener("input", render);
    channelEl.addEventListener("change", render);
    render();
  </script>
</body>
</html>
